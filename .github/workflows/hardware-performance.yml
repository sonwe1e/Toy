name: Hardware and Performance

# Kept separate from Build and Test on purpose: these suites need a GPU-equipped
# self-hosted runner and real playback load (paired 1080p60/4K30, D3D11VA), so they
# run on demand instead of on every pull request. The test layers exist in
# cmake/Testing.cmake ("hardware", "performance"); concrete suites land with
# USERPLAN Phase 6 (three-source 1080p60 decoding, long-video indexing). Until then
# this job configures, builds, and reports zero matching tests.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-performance:
    name: Hardware and performance suites
    runs-on: [self-hosted, Windows, X64, dvs-gpu]
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify pinned toolchain
        shell: pwsh
        run: |
          $cmakeVersion = cmake --version | Select-Object -First 1
          if ($cmakeVersion -notmatch '^cmake version 4\.4(\.|$)') {
            throw "Expected CMake 4.4.x, found: $cmakeVersion"
          }
          $vcpkgRoot = if ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } elseif ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } else {
            throw 'Set VCPKG_ROOT or VCPKG_INSTALLATION_ROOT on the runner.'
          }
          if (-not (Test-Path -LiteralPath "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
            throw "Invalid vcpkg root: $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Command cl.exe, ninja.exe -ErrorAction Stop

      - name: Configure
        shell: pwsh
        run: cmake --preset release

      - name: Build
        shell: pwsh
        run: cmake --build --preset release

      - name: Hardware and performance tests
        shell: pwsh
        run: >-
          ctest --preset release
          -L "hardware|performance" --output-on-failure
